name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, intl, json, mbstring, openssl, pcre, pdo, zip
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: composer test

      - run: composer check-cs
        if: matrix.php == '8.2'

      - run: composer phpstan
        if: matrix.php == '8.2'
